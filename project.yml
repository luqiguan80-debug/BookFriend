name: ShuYou
options:
  bundleIdPrefix: com.shuyou
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.19
targets:
  ShuYou:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - Mac
    dependencies:
      - package: ZIPFoundation
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: BookFriend
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - remote-notification
        # 声明 epub UTI，fileImporter 才能按 org.idpf.epub 过滤可选文件
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.idpf.epub
            UTTypeDescription: EPUB
            UTTypeConformsTo:
              - com.pkware.zip-archive
            UTTypeTagSpecification:
              public.filename-extension:
                - epub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shuyou.reader
        PRODUCT_NAME: BookFriend
        DEVELOPMENT_TEAM: P34F245S4P
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Support/ShuYou.entitlements
  ShuYouMac:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - App
    dependencies:
      - package: ZIPFoundation
    info:
      path: Support/InfoMac.plist
      properties:
        CFBundleDisplayName: BookFriend
        LSApplicationCategoryType: public.app-category.books
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
        # 同 iOS：声明 epub UTI，让文件面板只认 epub/pdf/txt
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.idpf.epub
            UTTypeDescription: EPUB
            UTTypeConformsTo:
              - com.pkware.zip-archive
            UTTypeTagSpecification:
              public.filename-extension:
                - epub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shuyou.reader
        PRODUCT_NAME: BookFriend
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Support/ShuYouMac.entitlements
